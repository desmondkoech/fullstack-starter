name: Fullstack CI
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '18'
    - name: Install
      run: npm ci || npm install
    - name: Lint
      run: echo 'no lint configured'
